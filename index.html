<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticketmaster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#026CDF',
            dark: '#121212',
            card: '#1a1a1a'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark text-white min-h-screen">

  <!-- Navbar -->
  <nav class="bg-dark border-b border-gray-800 p-4 flex justify-between items-center sticky top-0 z-40">
    <div class="text-2xl font-black">Ticket<span class="text-primary">master</span></div>
    
    <div id="authButtons" class="flex gap-2">
      <button onclick="showLogin()" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold">Sign In</button>
      <button onclick="showSignup()" class="bg-gray-700 text-white px-4 py-2 rounded-full text-sm font-semibold">Sign Up</button>
    </div>

    <div id="userInfo" class="hidden items-center gap-2">
      <button onclick="showMyTickets()" class="bg-gray-700 text-white px-3 py-2 rounded-full text-sm font-semibold">My Tickets</button>
      <span id="userEmail" class="text-sm text-gray-300 max-w-[100px] truncate hidden sm:inline"></span>
      <button onclick="logout()" class="bg-red-600 text-white px-3 py-2 rounded-full text-sm font-semibold">Logout</button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="relative h-80">
    <img src="https://picsum.photos/id/1015/1200/600" class="w-full h-full object-cover opacity-60" alt="hero">
    <div class="absolute inset-0 bg-gradient-to-t from-dark to-transparent"></div>
    <div class="absolute bottom-6 left-4 right-4">
      <p class="text-primary font-semibold mb-1 text-sm">Featured Event</p>
      <h1 class="text-2xl font-black mb-2">Taylor Swift | The Eras Tour</h1>
      <p class="text-gray-300 mb-4 text-sm">MetLife Stadium • East Rutherford, NJ • Oct 18, 2026</p>
      <button onclick="tryBuyTicket('Taylor Swift | The Eras Tour')" class="bg-primary px-6 py-3 rounded-full font-bold">Find Tickets</button>
    </div>
  </section>

  <!-- Categories -->
  <div class="px-4 py-4 flex gap-2 overflow-x-auto">
    <button onclick="filterEvents('All')" class="bg-primary text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">All Events</button>
    <button onclick="filterEvents('Concerts')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Concerts</button>
    <button onclick="filterEvents('Sports')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Sports</button>
    <button onclick="filterEvents('Comedy')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Comedy</button>
    <button onclick="filterEvents('Theater')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Theater</button>
    <button onclick="filterEvents('Festivals')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Festivals</button>
  </div>

  <!-- Events -->
  <div class="p-4 pb-20">
    <h2 class="text-xl font-bold mb-4">Upcoming Events Near You</h2>
    <div id="eventGrid" class="grid grid-cols-1 gap-4"></div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-card rounded-2xl p-6 w-full max-w-sm relative">
      <button onclick="closeAuthModal()" class="absolute top-3 right-3 text-2xl text-gray-400">&times;</button>
      <h3 id="authTitle" class="text-xl font-bold mb-4">Sign In</h3>
      <input id="email" type="email" placeholder="Email" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 mb-3 text-white">
      <input id="password" type="password" placeholder="Password (min 6 characters)" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 mb-4 text-white">
      <button id="authActionBtn" onclick="handleAuth()" class="w-full bg-primary py-3 rounded-full font-bold mb-3">Sign In</button>
      <p id="authMessage" class="text-sm text-center"></p>
    </div>
  </div>

  <!-- Ticket Modal -->
  <div id="ticketModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-card rounded-2xl p-6 w-full max-w-sm relative">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-2xl text-gray-400">&times;</button>
      <h3 id="modalTitle" class="text-xl font-bold mb-4"></h3>
      <div class="flex justify-between mb-4">
        <span>Standard Admission</span>
        <span class="font-semibold">$89.50</span>
      </div>
      <div class="flex items-center gap-4 mb-4">
        <button onclick="changeQty(-1)" class="w-8 h-8 bg-gray-700 rounded-full">−</button>
        <span id="qty" class="text-lg font-bold">1</span>
        <button onclick="changeQty(1)" class="w-8 h-8 bg-gray-700 rounded-full">+</button>
      </div>
      <div class="flex justify-between font-bold text-lg mb-6">
        <span>Total</span>
        <span id="total">$89.50</span>
      </div>
      <button onclick="checkout()" class="w-full bg-primary py-3 rounded-full font-bold">Continue to Checkout</button>
      <p id="checkoutMessage" class="text-sm text-center mt-3"></p>
    </div>
  </div>

  <!-- My Tickets Modal -->
  <div id="myTicketsModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-card rounded-2xl p-6 w-full max-w-md relative max-h-[80vh] overflow-y-auto">
      <button onclick="closeMyTickets()" class="absolute top-3 right-3 text-2xl text-gray-400">&times;</button>
      <h3 class="text-xl font-bold mb-4">My Tickets</h3>
      <div id="ticketsList" class="space-y-3">
        <p class="text-gray-400 text-center">Loading...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://wiekplllkzlvvenegtrt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpZWtwbGxsa3psdnZlbmVndHJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNjY1ODEsImV4cCI6MjEwNjc0MjU4MX0.dWRif6ucKNz6-GRmEPZimNNVMhK9gEFRbzEzLG0b8UU";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLoginMode = true;
    let qty = 1;
    let currentUser = null;
    let currentEventTitle = "";

    const events = [
      {title:"Billie Eilish World Tour", venue:"Madison Square Garden", date:"Nov 12, 2026", price:145, category:"Concerts", img:"https://picsum.photos/id/1011/600/400"},
      {title:"NBA Finals Game 3", venue:"Crypto.com Arena", date:"Jun 8, 2026", price:320, category:"Sports", img:"https://picsum.photos/id/1016/600/400"},
      {title:"Kevin Hart: Reality Check", venue:"Barclays Center", date:"Oct 25, 2026", price:95, category:"Comedy", img:"https://picsum.photos/id/1018/600/400"},
      {title:"Hamilton", venue:"Richard Rodgers Theatre", date:"Every Tue-Sun", price:189, category:"Theater", img:"https://picsum.photos/id/1025/600/400"},
      {title:"Coldplay Music of the Spheres", venue:"SoFi Stadium", date:"Sep 14, 2026", price:175, category:"Concerts", img:"https://picsum.photos/id/1036/600/400"},
      {title:"UFC 312", venue:"T-Mobile Arena", date:"Dec 5, 2026", price:210, category:"Sports", img:"https://picsum.photos/id/1040/600/400"},
      {title:"Dave Chappelle", venue:"The Theater at MSG", date:"Nov 3, 2026", price:130, category:"Comedy", img:"https://picsum.photos/id/1050/600/400"},
      {title:"Coachella Valley Music Festival", venue:"Empire Polo Club", date:"Apr 10-19, 2027", price:549, category:"Festivals", img:"https://picsum.photos/id/1060/600/400"}
    ];

    async function checkUser() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      currentUser = user;
      if (user) {
        document.getElementById("authButtons").classList.add("hidden");
        document.getElementById("userInfo").classList.remove("hidden");
        document.getElementById("userInfo").classList.add("flex");
        document.getElementById("userEmail").textContent = user.email;
      } else {
        document.getElementById("authButtons").classList.remove("hidden");
        document.getElementById("userInfo").classList.add("hidden");
      }
    }

    function showLogin() {
      isLoginMode = true;
      document.getElementById("authTitle").textContent = "Sign In";
      document.getElementById("authActionBtn").textContent = "Sign In";
      document.getElementById("authMessage").textContent = "";
      document.getElementById("authModal").classList.remove("hidden");
      document.getElementById("authModal").classList.add("flex");
    }

    function showSignup() {
      isLoginMode = false;
      document.getElementById("authTitle").textContent = "Create Account";
      document.getElementById("authActionBtn").textContent = "Sign Up";
      document.getElementById("authMessage").textContent = "";
      document.getElementById("authModal").classList.remove("hidden");
      document.getElementById("authModal").classList.add("flex");
    }

    function closeAuthModal() {
      document.getElementById("authModal").classList.add("hidden");
      document.getElementById("authModal").classList.remove("flex");
    }

    async function handleAuth() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const messageEl = document.getElementById("authMessage");

      if (!email || !password) {
        messageEl.textContent = "Please fill in all fields";
        messageEl.className = "text-sm text-center text-red-400";
        return;
      }

      messageEl.textContent = "Please wait...";
      messageEl.className = "text-sm text-center text-gray-400";

      if (isLoginMode) {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          messageEl.textContent = error.message;
          messageEl.className = "text-sm text-center text-red-400";
        } else {
          messageEl.textContent = "Login successful!";
          messageEl.className = "text-sm text-center text-green-400";
          setTimeout(() => {
            closeAuthModal();
            checkUser();
          }, 800);
        }
      } else {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
          messageEl.textContent = error.message;
          messageEl.className = "text-sm text-center text-red-400";
        } else {
          messageEl.textContent = "Account created! You can now Sign In.";
          messageEl.className = "text-sm text-center text-green-400";
        }
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      checkUser();
    }

    function tryBuyTicket(title) {
      if (!currentUser) {
        alert("Please Sign In first to buy tickets");
        showLogin();
        return;
      }
      currentEventTitle = title;
      openModal(title);
    }

    async function checkout() {
      if (!currentUser) {
        alert("Please Sign In first");
        closeModal();
        showLogin();
        return;
      }

      const messageEl = document.getElementById("checkoutMessage");
      messageEl.textContent = "Processing...";
      messageEl.className = "text-sm text-center text-gray-400";

      const total = (89.50 * qty).toFixed(2);

      const { error } = await supabaseClient.from("orders").insert({
        user_id: currentUser.id,
        event_title: currentEventTitle,
        quantity: qty,
        total_price: parseFloat(total)
      });

      if (error) {
        messageEl.textContent = "Error: " + error.message;
        messageEl.className = "text-sm text-center text-red-400";
      } else {
        messageEl.textContent = "Order successful! Tickets booked.";
        messageEl.className = "text-sm text-center text-green-400";
        setTimeout(() => {
          closeModal();
        }, 1500);
      }
    }

    async function showMyTickets() {
      if (!currentUser) {
        showLogin();
        return;
      }

      document.getElementById("myTicketsModal").classList.remove("hidden");
      document.getElementById("myTicketsModal").classList.add("flex");

      const list = document.getElementById("ticketsList");
      list.innerHTML = '<p class="text-gray-400 text-center">Loading your tickets...</p>';

      const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        list.innerHTML = '<p class="text-red-400 text-center">Error loading tickets</p>';
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-center">You have no tickets yet.</p>';
        return;
      }

      let html = "";
      data.forEach(order => {
        html += `
          <div class="bg-gray-800 rounded-xl p-4">
            <h4 class="font-bold text-lg">${order.event_title}</h4>
            <div class="flex justify-between text-sm text-gray-400 mt-2">
              <span>Qty: ${order.quantity}</span>
              <span class="text-primary font-semibold">$${order.total_price}</span>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    function closeMyTickets() {
      document.getElementById("myTicketsModal").classList.add("hidden");
      document.getElementById("myTicketsModal").classList.remove("flex");
    }

    function renderEvents(list) {
      const grid = document.getElementById("eventGrid");
      let html = "";
      list.forEach(function(e) {
        html += '<div class="bg-card rounded-xl overflow-hidden" onclick="tryBuyTicket(\'' + e.title + '\')">';
        html += '<img src="' + e.img + '" class="w-full h-48 object-cover">';
        html += '<div class="p-4">';
        html += '<span class="text-xs bg-primary px-2 py-1 rounded">' + e.category + '</span>';
        html += '<h3 class="font-bold text-lg mt-2">' + e.title + '</h3>';
        html += '<p class="text-gray-400 text-sm">' + e.venue + '</p>';
        html += '<p class="text-gray-500 text-sm mb-2">' + e.date + '</p>';
        html += '<div class="flex justify-between items-center">';
        html += '<span class="text-primary font-bold">From $' + e.price + '</span>';
        html += '<button class="bg-gray-800 text-sm px-3 py-1 rounded-full">Tickets</button>';
        html += '</div></div></div>';
      });
      grid.innerHTML = html;
    }

    function filterEvents(category) {
      if (category === "All") {
        renderEvents(events);
      } else {
        renderEvents(events.filter(e => e.category === category));
      }
    }

    function openModal(title) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("ticketModal").classList.remove("hidden");
      document.getElementById("ticketModal").classList.add("flex");
      qty = 1;
      document.getElementById("qty").textContent = qty;
      document.getElementById("total").textContent = "$89.50";
      document.getElementById("checkoutMessage").textContent = "";
    }

    function closeModal() {
      document.getElementById("ticketModal").classList.add("hidden");
      document.getElementById("ticketModal").classList.remove("flex");
    }

    function changeQty(num) {
      qty = Math.max(1, qty + num);
      document.getElementById("qty").textContent = qty;
      document.getElementById("total").textContent = "$" + (89.50 * qty).toFixed(2);
    }

    // Start
    checkUser();
    renderEvents(events);
  </script>
</body>
</html>
