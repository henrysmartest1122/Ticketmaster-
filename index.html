<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticketmaster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#026CDF',
            dark: '#121212',
            card: '#1a1a1a'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark text-white min-h-screen">

  <!-- Navbar -->
  <nav class="bg-dark border-b border-gray-800 p-4 flex justify-between items-center sticky top-0 z-40">
    <div class="text-2xl font-black">Ticket<span class="text-primary">master</span></div>
    
    <div id="authButtons" class="flex gap-2">
      <button onclick="showLogin()" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold">Sign In</button>
      <button onclick="showSignup()" class="bg-gray-700 text-white px-4 py-2 rounded-full text-sm font-semibold">Sign Up</button>
    </div>

    <div id="userInfo" class="hidden items-center gap-3">
      <span id="userEmail" class="text-sm text-gray-300"></span>
      <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-full text-sm font-semibold">Logout</button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="relative h-96">
    <img src="https://picsum.photos/id/1015/1200/600" class="w-full h-full object-cover opacity-60" alt="hero">
    <div class="absolute inset-0 bg-gradient-to-t from-dark to-transparent"></div>
    <div class="absolute bottom-8 left-4 right-4">
      <p class="text-primary font-semibold mb-1">Featured Event</p>
      <h1 class="text-3xl font-black mb-2">Taylor Swift | The Eras Tour</h1>
      <p class="text-gray-300 mb-4">MetLife Stadium • East Rutherford, NJ • Oct 18, 2026</p>
      <button onclick="tryBuyTicket('Taylor Swift | The Eras Tour')" class="bg-primary px-6 py-3 rounded-full font-bold">Find Tickets</button>
    </div>
  </section>

  <!-- Events -->
  <div class="p-4">
    <h2 class="text-xl font-bold mb-4">Upcoming Events Near You</h2>
    <div id="eventGrid" class="grid grid-cols-1 gap-4"></div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-card rounded-2xl p-6 w-full max-w-sm relative">
      <button onclick="closeAuthModal()" class="absolute top-3 right-3 text-2xl text-gray-400">&times;</button>
      
      <h3 id="authTitle" class="text-xl font-bold mb-4">Sign In</h3>
      
      <input id="email" type="email" placeholder="Email" class
