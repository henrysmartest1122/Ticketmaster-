<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticketmaster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#026CDF',
            dark: '#0f0f0f',
            card: '#1a1a1a'
          }
        }
      }
    }
  </script>
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-dark text-white min-h-screen">

  <!-- Navbar -->
  <nav class="bg-dark/95 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center sticky top-0 z-40">
    <div class="text-2xl font-black tracking-tight">Ticket<span class="text-primary">master</span></div>
    
    <div id="authButtons" class="flex gap-2">
      <button onclick="showLogin()" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition">Sign In</button>
      <button onclick="showSignup()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition">Sign Up</button>
    </div>

    <div id="userInfo" class="hidden items-center gap-2">
      <button onclick="showMyTickets()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded-full text-sm font-semibold transition">My Tickets</button>
      <button id="adminBtn" onclick="showAdmin()" class="hidden bg-purple-700 hover:bg-purple-600 text-white px-3 py-2 rounded-full text-sm font-semibold transition">Admin</button>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-full text-sm font-semibold transition">Logout</button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="relative h-72 md:h-96">
    <img src="https://picsum.photos/id/1015/1400/700" class="w-full h-full object-cover opacity-50" alt="hero">
    <div class="absolute inset-0 bg-gradient-to-t from-dark via-dark/70 to-transparent"></div>
    <div class="absolute bottom-6 left-4 right-4">
      <p class="text-primary font-semibold mb-1 text-sm">Featured Event</p>
      <h1 class="text-2xl md:text-4xl font-black mb-2">Taylor Swift | The Eras Tour</h1>
      <p class="text-gray-300 mb-4 text-sm">MetLife Stadium • East Rutherford, NJ • Oct 18, 2026</p>
      <button onclick="tryBuyTicket('Taylor Swift | The Eras Tour', 249)" class="bg-primary hover:bg-blue-600 px-6 py-3 rounded-full font-bold transition">Find Tickets</button>
    </div>
  </section>

  <!-- Search + Categories -->
  <div class="px-4 py-4 space-y-3">
    <input id="searchInput" oninput="handleSearch()" type="text" placeholder="Search events, artists, venues..." 
           class="w-full bg-card border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-primary">
    
    <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-1">
      <button onclick="filterEvents('All')" class="category-btn bg-primary text-white px-4 py-2 rounded-full text-sm whitespace-nowrap font-medium">All Events</button>
      <button onclick="filterEvents('Concerts')" class="category-btn bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap font-medium">Concerts</button>
      <button onclick="filterEvents('Sports')" class="category-btn bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap font-medium">Sports</button>
      <button onclick="filterEvents('Comedy')" class="category-btn bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap font-medium">Comedy</button>
      <button onclick="filterEvents('Theater')" class="category-btn bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap font-medium">Theater</button>
      <button onclick="filterEvents('Festivals')" class="category-btn bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap font-medium">Festivals</button>
    </div>
  </div>

  <!-- Events -->
  <div class="p-4 pb-24">
