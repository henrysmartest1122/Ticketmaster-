<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticketmaster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#026CDF',
            dark: '#121212',
            card: '#1a1a1a'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark text-white min-h-screen">

  <!-- Navbar -->
  <nav class="bg-dark border-b border-gray-800 p-4 flex justify-between items-center sticky top-0 z-40">
    <div class="text-2xl font-black">Ticket<span class="text-primary">master</span></div>
    
    <div id="authButtons" class="flex gap-2">
      <button onclick="showLogin()" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold">Sign In</button>
      <button onclick="showSignup()" class="bg-gray-700 text-white px-4 py-2 rounded-full text-sm font-semibold">Sign Up</button>
    </div>

    <div id="userInfo" class="hidden items-center gap-2">
      <button onclick="showMyTickets()" class="bg-gray-700 text-white px-3 py-2 rounded-full text-sm font-semibold">My Tickets</button>
      <span id="userEmail" class="text-sm text-gray-300 max-w-[100px] truncate hidden sm:inline"></span>
      <button onclick="logout()" class="bg-red-600 text-white px-3 py-2 rounded-full text-sm font-semibold">Logout</button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="relative h-80">
    <img src="https://picsum.photos/id/1015/1200/600" class="w-full h-full object-cover opacity-60" alt="hero">
    <div class="absolute inset-0 bg-gradient-to-t from-dark to-transparent"></div>
    <div class="absolute bottom-6 left-4 right-4">
      <p class="text-primary font-semibold mb-1 text-sm">Featured Event</p>
      <h1 class="text-2xl font-black mb-2">Taylor Swift | The Eras Tour</h1>
      <p class="text-gray-300 mb-4 text-sm">MetLife Stadium • East Rutherford, NJ • Oct 18, 2026</p>
      <button onclick="tryBuyTicket('Taylor Swift | The Eras Tour')" class="bg-primary px-6 py-3 rounded-full font-bold">Find Tickets</button>
    </div>
  </section>

  <!-- Categories -->
  <div class="px-4 py-4 flex gap-2 overflow-x-auto">
    <button onclick="filterEvents('All')" class="bg-primary text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">All Events</button>
    <button onclick="filterEvents('Concerts')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Concerts</button>
    <button onclick="filterEvents('Sports')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Sports</button>
    <button onclick="filterEvents('Comedy')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Comedy</button>
    <button onclick="filterEvents('Theater')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Theater</button>
    <button onclick="filterEvents('Festivals')" class="bg-card text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">Festivals</button>
  </div>

  <!-- Events -->
  <div class="p-4 pb-20">
