<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticketmaster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#026CDF',
            dark: '#0f0f0f',
            card: '#1a1a1a'
          }
        }
      }
    }
  </script>
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-dark text-white min-h-screen">

  <!-- Navbar -->
  <nav class="bg-dark/95 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center sticky top-0 z-40">
    <div class="text-2xl font-black tracking-tight">Ticket<span class="text-primary">master</span></div>
    
    <div id="authButtons" class="flex gap-2">
      <button onclick="showLogin()" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition">Sign In</button>
      <button onclick="showSignup()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition">Sign Up</button>
    </div>

    <div id="userInfo" class="hidden items-center gap-2">
      <button onclick="showMyTickets()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded-full text-sm font-semibold transition">My Tickets</button>
      <button id="adminBtn" onclick="showAdmin()" class="hidden bg-purple-700 hover:bg-purple-600 text-white px-3 py-2 rounded-full text-sm font-semibold transition">Admin</button>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-full text-sm font-semibold transition">Logout</button>
    </div>
  </nav>
